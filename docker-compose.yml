version: '3.8'

services:
  ttscope-postgres:
    image: pgvector/pgvector:pg16
    container_name: ttscope-postgres
    restart: always
    environment:
      POSTGRES_USER: ttscope
      POSTGRES_PASSWORD: ttscope_password_local_dev
      POSTGRES_DB: ttscope
    ports:
      - "5432:5432"
    volumes:
      - ttscope_pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  ttscope_pgdata:
